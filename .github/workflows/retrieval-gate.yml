name: retrieval-gate

# Recall@8 and MRR over the golden set with the real, pinned BGE-M3 and bge-reranker-v2-m3
# (CPU), failing below businesses/casa-prado/evals/thresholds.yaml. Runs on changes that can
# move retrieval: search and ingest, but also who may see what (people, policy, oracle, the
# gate and the audience filter) and how the golden set is loaded and scored. No model API
# call: search only.
on:
  pull_request:
    paths:
      - "src/brain/**"
      - "businesses/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/retrieval-gate.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain-local-only
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U brain -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      BRAIN_DATABASE_URL: postgresql://brain:brain-local-only@127.0.0.1:55432/postgres
      HF_HUB_DISABLE_TELEMETRY: "1"
    defaults:
      run:
        working-directory: company-brain-demo
    steps:
      - uses: actions/checkout@v4
        with:
          path: company-brain-demo
      - uses: actions/checkout@v4
        with:
          repository: miggy-code/agentgate
          ref: 54d70232990c7a29da37b1a81a5f69c07e138b42
          path: agentgate
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.27"
      # The weights (~4.5 GB) at the revisions pinned in ingest/embedding.py and
      # search/rerank.py; the key changes when a pin does.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3-5617a9f61b02-reranker-953dc6f6f85a
      - name: Install
        run: uv sync --locked
      - name: Index with the real models
        run: |
          uv run brain business create casa-prado
          uv run brain index casa-prado --models bge
      - name: Retrieval gate
        run: uv run brain eval casa-prado --suite retrieval --gate
