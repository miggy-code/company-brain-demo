name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain-local-only
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U brain -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      BRAIN_DATABASE_URL: postgresql://brain:brain-local-only@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.27"
      - name: Install
        run: uv sync --locked
      - name: Lint and types
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run mypy src
      # Fakes only (HashEmbedder, IdentityReranker, the mock provider behind the real
      # agentgate proxy). No live model call and no model weights in CI.
      - name: Tests
        run: uv run pytest
      - name: Permission suite (fails on any leak)
        run: |
          uv run brain business create casa-prado
          uv run brain index casa-prado --models fake
          uv run brain eval casa-prado --suite permissions
      # Every scenario must pass and match redteam/baseline.json, under the worst-case models
      # (echo, obey) and one that can decline (mock, for the not-found wording checks). The
      # mutation tests in tests/mutations run with the tests above.
      - name: Leak suite (fails on any failure or missing scenario)
        run: |
          uv run brain redteam casa-prado --model echo
          uv run brain redteam casa-prado --model obey
          uv run brain redteam casa-prado --model mock
      # Unit 05: the same attacks through the MCP server, as an MCP client sees it, plus the
      # MCP grid (read_item on every item, deals under every filter) for every person.
      - name: Leak suite over MCP
        run: |
          uv run brain redteam casa-prado --via mcp --model echo
          uv run brain redteam casa-prado --via mcp --model obey
          uv run brain redteam casa-prado --via mcp --model mock
      # Unit 04: replay 8 simulated weeks through the change feed and a separate sync worker.
      # Every revocation must be forgotten within the bound (10 poll intervals), and a second
      # replay with the same seed must give the same events and final state.
      - name: Company simulator (deterministic replay, time to forget)
        run: |
          uv run brain simulate casa-prado --weeks 8 --seed 7 --models fake --forget --json > sim-1.json
          uv run brain simulate casa-prado --weeks 8 --seed 7 --models fake --json > sim-2.json
          jq '{forget, events_digest, state_digest}' sim-1.json
          test "$(jq -r '.events_digest, .state_digest' sim-1.json)" = "$(jq -r '.events_digest, .state_digest' sim-2.json)"
          uv run brain index casa-prado --models fake
      # Answer metrics need a live model, which CI never calls. Instead the newest live
      # report in reports/ must carry the current answer fingerprint (prompts, grader, model
      # config) and meet the answer thresholds, so a prompt or model change lands with a run.
      - name: Answer report check
        run: uv run brain eval casa-prado --check-report

  # Unit 05: the MCP server over HTTP against the real identity provider, Casa Prado's
  # Keycloak realm (synthetic accounts, local test passwords).
  keycloak:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain-local-only
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U brain -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      BRAIN_DATABASE_URL: postgresql://brain:brain-local-only@127.0.0.1:55432/postgres
      BRAIN_KEYCLOAK_URL: http://127.0.0.1:8080
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.27"
      - name: Install
        run: uv sync --locked
      # A job service cannot take a command, so Keycloak starts with docker run.
      - name: Start Keycloak
        run: >
          docker run -d --name keycloak -p 127.0.0.1:8080:8080
          -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin-local-only
          -v "$GITHUB_WORKSPACE/businesses/casa-prado/keycloak/realm-casa-prado.json:/opt/keycloak/data/import/realm-casa-prado.json:ro"
          quay.io/keycloak/keycloak:26.8.2 start-dev --import-realm
      - name: Wait for Keycloak
        run: |
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/realms/casa-prado/.well-known/openid-configuration > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs keycloak
          exit 1
      - name: Keycloak tests
        run: uv run pytest -m keycloak -v
