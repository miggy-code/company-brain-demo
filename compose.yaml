# Local Postgres with pgvector for the demo. One database per business is created inside it
# by `brain business create`. Port 55432 avoids clashing with a Postgres already on 5432.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain-local-only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The identity provider for the MCP server's HTTP transport (unit 05), with Casa Prado's
  # synthetic realm. Only with `docker compose --profile auth up -d`. Admin and user passwords
  # are local test values.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    profiles: ["auth"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-only
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./businesses/casa-prado/keycloak/realm-casa-prado.json:/opt/keycloak/data/import/realm-casa-prado.json:ro

volumes:
  pgdata:
