# Golden set for Casa Prado (03): 80 questions, 20 per business line, 40 Spanish and 40
# English. Cross-language means the question's language differs from every expected item's.
# A question with no expected items has no answer anywhere in the corpus (a plausible topic
# no item covers, not a restricted one: those belong to the leak suite) and must get the
# not-found reply. Each asker may see every expected item (checked against the permission
# oracle when the set loads). `reference` lists the facts a correct answer states; the
# grader checks answers against them.

questions:

  # Property management
