    line: property-management
    language: es
    asker: cp-carla
    question: ¿Cuál es el estado de la orden de trabajo de la bomba de agua en Torre Alameda?
    expected_items: [cp-drive-ot-alameda-0412]
  - id: g02
    line: property-management
    language: en
    cross_language: true
    asker: cp-carla
