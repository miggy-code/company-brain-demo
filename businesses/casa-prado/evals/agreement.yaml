# source, never the grader's verdict. Agent-labelled, not human: the same agent wrote the
# corpus, the golden set and its reference facts, so this measures rubric consistency, not
# independent human judgement.
# Judgement calls: an answer to a no-answer question is `incorrect` (row 344 gave a list
# price for a final sale price that does not exist); a sentence citing a source that states
# only part of it is `partial` (row 498 pair 3 lists three quotes, the cited row holds one);
# row 469 pair 2 is `supported` because the source states the sentence as written, though
# the answer applied Torre Alameda's rules to Los Cedros (an answer to the same question,
# row 478, is labelled incorrect for it).
