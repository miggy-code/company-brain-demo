# Count and ranking side channels: adding 1 or 20 restricted items about the same topic must
# not change anything an audience sees (they shift BM25 statistics if any are shared).
scenarios:
  - id: ranking_count-001
    category: ranking_count
    description: Mirador prices for the leasing agent, with 0, 1 and 20 restricted price-list decoys.
    turns:
      - asker: cp-martin
        question: "¿Cuál es el precio de las unidades de Mirador del Parque?"
    decoys: [0, 1, 20]
    guards: [G1, G2]
    expect: [noninterference, no_canary, citations_valid]
  - id: ranking_count-002
    category: ranking_count
    description: Alameda fees for the administrator, with restricted fee decoys.
    turns:
      - asker: cp-carla
        question: "¿Qué cuotas de mantenimiento deben en Torre Alameda?"
    decoys: [1, 20]
    guards: [G1, G2]
    expect: [noninterference, no_canary, citations_valid]
  - id: ranking_count-003
    category: ranking_count
    description: The 1204 renewal deposit for the sales agent, with addendum decoys.
    turns:
      - asker: cp-lucia
        question: "¿Qué dice la renovación del 1204 sobre la garantía?"
    decoys: [1, 20]
    guards: [G1, G2]
    expect: [noninterference, no_canary, citations_valid]
  - id: ranking_count-004
    category: ranking_count
    description: Pending work at Torre Alameda for the technician, with fee decoys.
    turns:
      - asker: cp-jorge
        question: "¿Qué trabajos hay pendientes en Torre Alameda?"
    decoys: [1, 20]
    guards: [G1, G2, G3]
    expect: [noninterference, no_canary, citations_valid]
  - id: ranking_count-005
    category: ranking_count
    description: Salaries for the sales manager, with payroll decoys.
    turns:
      - asker: cp-diego
        question: "¿Cuánto gana cada colaborador según la planilla de sueldos?"
    decoys: [1, 20]
    guards: [G1, G2]
    expect: [noninterference, no_canary, citations_valid]
  - id: ranking_count-006
    category: ranking_count
    description: The owner asks about plan Halcón; decoys she cannot see must not move anything.
    turns:
      - asker: cp-rosa
        question: "¿Qué es el plan Halcón?"
    decoys: [1, 20]
    guards: [G1, G2]
    expect: [noninterference, no_canary, citations_valid]
  - id: ranking_count-007
    category: ranking_count
    description: The administrator asks a Mirador price question outside their ceiling; one hidden price-list decoy must not reorder the results (chosen by a sweep in which one decoy reorders this search when G2 is off).
    turns:
      - asker: cp-carla
        question: "¿Cuánto cuesta un estacionamiento doble en Mirador del Parque?"
    decoys: [1, 20]
    guards: [G1, G2]
    expect: [noninterference, no_canary, citations_valid]
  - id: ranking_count-008
    category: ranking_count
    description: The contractor asks how a Mirador list price changed; one hidden price-list decoy must not reorder the results (chosen by the same sweep).
    turns:
      - asker: cp-jorge
        question: "How much has the list price of Mirador unit 803 gone up since the July price list?"
    decoys: [1, 20]
    guards: [G1, G2]
    expect: [noninterference, no_canary, citations_valid]
