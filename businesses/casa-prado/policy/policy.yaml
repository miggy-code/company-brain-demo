# agentgate policy for Casa Prado. Deny by default. The source ACL decides who could see an
# item at all; these rules only narrow below it, by role, label and tags.
apiVersion: agentgate/v1
customer: casa-prado

# Least to most sensitive.
labels: [public, internal, confidential, restricted]
default: deny

spend:
  per_run_usd: "3.00"
  per_customer_day_usd: "20.00"
  max_calls_per_run: 1000

approvals:
  approver_roles: [owner, manager]
  ttl_minutes: 60
  risk_threshold: 50

# Models answer generation may call through the proxy.
models:
  allow:
    - id: deepseek-flash
      provider: openai_compatible
      model: deepseek-flash
      roles: [owner, manager, staff, contractor]
      max_output_tokens: 4000
      max_request_bytes: 200000
    - id: claude-opus-5-5
      provider: anthropic
      model: claude-opus-5-5
      roles: [owner, manager, staff, contractor]
      max_output_tokens: 16000
      max_request_bytes: 200000
  reserve: computed

rules:
  - id: owner-read
    effect: allow
    description: The owner may read everything the sources share with her.
    roles: [owner]
    tools: [docs.search, docs.read]
    actions: [read]
    labels: {max: restricted}

  - id: team-read
    effect: allow
    description: Managers and staff may read up to confidential (contracts, offers, fees).
    roles: [manager, staff]
    tools: [docs.search, docs.read]
    actions: [read]
    labels: {max: confidential}

  - id: staff-read-tenant-screening
    effect: allow
    description: Staff may read restricted tenant screening notes the source shares with them.
    roles: [staff]
    tools: [docs.search, docs.read]
    actions: [read]
    labels: {max: restricted}
    where:
      doc_tags_any: [tenant-screening]

  - id: contractor-read-public
    effect: allow
    description: Contractors may read public material.
    roles: [contractor]
    tools: [docs.search, docs.read]
    actions: [read]
    labels: {max: public}

  - id: contractor-read-work-orders
    effect: allow
    description: Contractors may read internal work orders, nothing else in a shared folder.
    roles: [contractor]
    tools: [docs.search, docs.read]
    actions: [read]
    labels: {max: internal}
    where:
      doc_tags_any: [work-order]
