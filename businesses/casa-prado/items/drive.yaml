  kind: doc
  title: Política de comisiones 2026
  location: Drive / Compañía
  updated: 2026-01-10
  label: internal
  tags: [policy]
  acl: [domain:casaprado.example]
  canary: AGCANARY-67099FDC0615
  body: |
    1. Ventas de reventa. El asesor recibe el 30% de la comisión cobrada al cliente.
    2. Proyectos en preventa. El asesor recibe el 25% de la comisión cobrada al
    desarrollador por cada unidad con minuta firmada.
    3. Alquileres. El asesor recibe el 40% del primer mes de renta cobrado como comisión.
    4. Pago. Las comisiones se pagan el mes siguiente al cobro efectivo.

