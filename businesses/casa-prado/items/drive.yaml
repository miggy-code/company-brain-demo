    1. Horario. La oficina atiende de lunes a viernes de 9:00 a 18:00; los asesores
    cubren visitas los sábados por turnos.
    2. Vacaciones. Se solicitan con 30 días de anticipación en el formulario de RR. HH.
    3. Uso de datos de clientes. Los datos de compradores, inquilinos y propietarios solo
    se usan para la gestión del encargo y nunca se comparten fuera de la empresa.
    4. Gastos de movilidad. Se reembolsan con boleta o factura dentro del mes.

