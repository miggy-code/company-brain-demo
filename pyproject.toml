[project]
name = "company-brain-demo"
version = "0.1.0"
description = "A permission-aware company knowledge agent, demonstrated on a synthetic business."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17,<2",
    "lingua-language-detector>=2.1,<3",
    "mcp>=2.3,<3",
    "openai>=3.57,<4",
    "panoptes-agentgate>=0.3.0,<0.4",
    "panoptes-observe>=0.3,<0.4",
    "pgvector>=0.5.1,<0.6",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.14,<3",
    "pyyaml>=6,<7",
    "sentence-transformers>=6.3,<7",
    "torch>=2.15,<3",
    "typer>=0.29,<1",
]

[project.scripts]
brain = "brain.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4,<3",
    "pytest>=9.2,<10",
    "ruff>=0.17,<1",
    "types-pyyaml>=6,<7",
]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[tool.uv.sources]
# CPU wheels on Linux keep CI from downloading CUDA builds; macOS wheels come from PyPI.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not slow'"
markers = ["slow: loads the real BGE models (about 4.5 GB); run with -m slow"]
